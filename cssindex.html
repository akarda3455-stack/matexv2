<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌌 MATEX | Logo & Paneller</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @media (max-width: 1200px) {
            .categories-grid {
                grid-template-columns: repeat(4, 1fr) !important;
            }
        }

        @media (max-width: 900px) {
            .categories-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }

            .profile-section {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 600px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }

            .screen {
                padding: 25px;
            }

            .logo-text {
                font-size: 36px !important;
            }
        }

        @media (max-width: 480px) {
            .categories-grid {
                grid-template-columns: 1fr !important;
            }

            .gender-group {
                flex-direction: column;
            }
        }

        .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.4);
            background: linear-gradient(135deg, #3a7bd5, #8a2be2);
        }

        .back-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            color: #ffffff;
            border-color: #8a2be2;
            transform: translateX(-5px);
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #8a2be2;
            box-shadow: 0 15px 30px rgba(0, 210, 255, 0.2);
            background: rgba(0, 210, 255, 0.1);
        }

        .difficulty-card:hover {
            transform: scale(1.05);
            border-color: #8a2be2;
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.3);
        }

        .option-btn:hover {
            background: rgba(0, 210, 255, 0.1);
            border-color: #8a2be2;
            transform: translateX(8px);
        }

        .nav-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: #8a2be2;
        }

        .gender-option:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: #8a2be2;
        }

        .avatar-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: #8a2be2;
            transform: scale(1.05);
        }

        .exit-test-btn:hover {
            background: rgba(255, 107, 107, 0.4);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        .feedback-btn:hover {
            background: linear-gradient(135deg, #3a7bd5, #8a2be2);
            transform: translateY(-2px);
        }

        .social-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .result-item:hover {
            background: rgba(0, 210, 255, 0.1);
            border-color: #8a2be2;
            transform: translateX(5px);
        }

        .avatar-option:hover {
            transform: scale(1.1);
            border-color: #8a2be2;
            background: rgba(0, 210, 255, 0.15);
        }

        .profile-shell {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-hero {
            background: linear-gradient(135deg, rgba(2, 6, 23, 0.95), rgba(26, 31, 60, 0.85));
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 24px;
            padding: 22px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .hero-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(0, 210, 255, 0.14);
            color: #8de8ff;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .profile-hero h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .profile-hero p {
            color: #bcdcff;
            font-size: 15px;
            line-height: 1.6;
        }

        .feature-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .feature-pill {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(138, 43, 226, 0.16);
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: #f2e4ff;
            font-size: 13px;
            font-weight: 600;
        }

        .main-container {
            transition: transform 0.4s ease;
            width: 1300px;
            max-width: 98%;
            z-index: 10;
        }

        /* SOL ÜST - ARMA SİSTEMİ */
        .rank-system-left {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 30px;
            padding: 15px 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 15px;
            border-radius: 40px;
            transition: all 0.3s;
            cursor: default;
        }

        .rank-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid;
        }

        .rank-info {
            display: flex;
            flex-direction: column;
        }

        .rank-name {
            font-weight: 700;
            font-size: 14px;
        }

        .rank-desc {
            font-size: 10px;
            opacity: 0.8;
        }

        .rank-bronz .rank-icon {
            border-color: #cd7f32;
            color: #cd7f32;
        }

        .rank-bronz .rank-name {
            color: #cd7f32;
        }

        .rank-gumus .rank-icon {
            border-color: #c0c0c0;
            color: #c0c0c0;
        }

        .rank-gumus .rank-name {
            color: #c0c0c0;
        }

        .rank-altin .rank-icon {
            border-color: #ffd700;
            color: #ffd700;
        }

        .rank-altin .rank-name {
            color: #ffd700;
        }

        .rank-elmas .rank-icon {
            border-color: #00d2ff;
            color: #00d2ff;
        }

        .rank-elmas .rank-name {
            color: #00d2ff;
        }

        .rank-locked {
            opacity: 0.4;
            filter: grayscale(0.5);
        }

        .rank-locked .rank-icon {
            border-color: #555;
            color: #555;
        }

        .rank-locked .rank-name {
            color: #777;
        }

        .rank-active {
            box-shadow: 0 0 15px currentColor;
        }

        .total-points-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 8px;
            margin-top: 5px;
            border-top: 1px solid rgba(0, 210, 255, 0.3);
            justify-content: center;
        }

        .total-points-value {
            color: #00d2ff;
            font-size: 24px;
            font-weight: 800;
        }

        .total-points-label {
            color: #7eb8ff;
            font-size: 11px;
        }

        /* SAĞ ÜST PANEL - ALT ALTA */
        .top-right-panel {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        .updates-btn {
            background: rgba(138, 43, 226, 0.2);
            backdrop-filter: blur(15px);
            border: 2px solid #8a2be2;
            border-radius: 50px;
            padding: 12px 25px;
            color: #c9a9ff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .updates-btn:hover {
            background: rgba(138, 43, 226, 0.3);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
            transform: translateY(-2px);
        }

        .new-badge {
            background: #ff4444;
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            margin-left: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .developer-credit {
            background: rgba(0, 210, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.5);
            border-radius: 50px;
            padding: 12px 25px;
            color: #00d2ff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
        }

        .developer-credit:hover {
            background: rgba(0, 210, 255, 0.25);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
            transform: translateY(-2px);
        }

        /* DEXTER PROFİL KARTI */
        .dexter-profile-card {
            position: fixed;
            top: 90px;
            right: 30px;
            z-index: 102;
            background: rgba(20, 25, 35, 0.98);
            backdrop-filter: blur(20px);
            border: 2px solid #5865F2;
            border-radius: 25px;
            padding: 25px;
            width: 350px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: none;
            animation: slideDown 0.3s ease;
        }

        .dexter-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .dexter-avatar-large {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #5865F2, #8a2be2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: 700;
            color: white;
        }

        .dexter-info h3 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .dexter-info .dexter-username {
            color: #888;
            font-size: 14px;
        }

        .dexter-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            padding: 10px;
            background: rgba(88, 101, 242, 0.1);
            border-radius: 15px;
            color: white;
        }

        .dexter-badges {
            display: flex;
            gap: 8px;
            margin: 15px 0;
        }

        .dexter-badge {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid #00d2ff;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            color: white;
        }

        .dexter-planes {
            display: flex;
            gap: 5px;
            margin: 15px 0;
            color: #ffd700;
            font-size: 18px;
        }

        .dexter-join {
            color: #ccc;
            font-size: 13px;
            margin: 15px 0;
        }

        .dexter-note {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* GÜNCELLEME PANELİ - BUTONUN ALTINDA */
        .updates-panel {
            position: fixed;
            top: 145px;
            right: 30px;
            z-index: 101;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #8a2be2;
            border-radius: 30px;
            padding: 25px;
            min-width: 380px;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: none;
            animation: slideDown 0.3s ease;
            scrollbar-width: none;
        }

        .updates-panel h3 {
            color: white !important;
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .update-item {
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(138, 43, 226, 0.1);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .update-item:hover {
            background: rgba(138, 43, 226, 0.2);
            border-color: #8a2be2;
        }

        .update-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .update-version {
            color: white !important;
            font-weight: 700;
            font-size: 18px;
        }

        .update-date {
            color: #ccc !important;
            font-size: 12px;
        }

        .update-desc {
            color: white !important;
            font-size: 14px;
        }

        .update-details {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            color: white !important;
            font-size: 13px;
            line-height: 1.6;
        }

        .update-details.show {
            display: block;
        }

        .update-details li {
            color: white !important;
        }

        .close-updates {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #8a2be2;
            border-radius: 30px;
            padding: 10px;
            color: white !important;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }

        /* YAPIMCI PANELİ - BUTONUN ALTINDA */
        .credits-panel {
            position: fixed;
            top: 145px;
            right: 30px;
            z-index: 101;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid #00d2ff;
            border-radius: 30px;
            padding: 25px;
            min-width: 320px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .credits-panel h3 {
            color: white !important;
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .close-credits {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00d2ff;
            border-radius: 30px;
            padding: 10px;
            color: white !important;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }

        .credits-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            color: white !important;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .credits-item i {
            width: 25px;
            color: #00d2ff;
        }

        .credits-item .label {
            flex: 1;
            color: #ccc !important;
        }

        .credits-item .value {
            color: white !important;
            font-weight: 600;
        }

        .credits-item.clickable {
            cursor: pointer;
            transition: all 0.3s;
        }

        .credits-item.clickable:hover {
            background: rgba(88, 101, 242, 0.15);
            border-radius: 15px;
            padding-left: 10px;
        }

        .sponsor-badge {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: black !important;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        .partner-badge {
            background: linear-gradient(135deg, #8a2be2, #00d2ff);
            color: white !important;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.4);
            border-radius: 25px;
            padding: 12px 15px;
            width: 240px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white !important;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .feedback-header i {
            color: #00d2ff;
        }

        .feedback-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #00d2ff;
            border-radius: 15px;
            padding: 8px 12px;
            color: white;
            font-size: 12px;
            resize: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin-bottom: 8px;
        }

        .feedback-input::placeholder {
            color: #aaa;
            font-size: 11px;
        }

        .feedback-btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .feedback-success {
            color: #4caf50 !important;
            font-size: 11px;
            text-align: center;
            margin-top: 5px;
            display: none;
        }

        .social-media-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 12px;
            background: rgba(10, 15, 30, 0.5);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 50px;
            padding: 8px 15px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(0, 210, 255, 0.5);
            text-decoration: none;
        }

        .social-btn.discord {
            background: linear-gradient(135deg, #5865F2, #404EED);
            color: white;
        }

        .social-btn.youtube {
            background: linear-gradient(135deg, #FF0000, #CC0000);
            color: white;
        }

        .social-btn.instagram {
            background: linear-gradient(135deg, #833AB4, #E1306C, #FCAF45);
            color: white;
        }

        .social-btn.movyra {
            background: linear-gradient(135deg, #e50914, #b20710);
            color: white;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        .theme-space {
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 30%, #0d0d3d 60%, #000000 100%);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        .shooting-star {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, white, transparent);
            animation: shoot 6s linear infinite;
        }

        @keyframes shoot {
            0% {
                transform: translateX(-150px) translateY(-150px) rotate(45deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            20% {
                transform: translateX(calc(100vw + 150px)) translateY(calc(100vh + 150px)) rotate(45deg);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        .theme-araba {
            background: linear-gradient(135deg, #1a1000 0%, #2d1a00 50%, #0d0a00 100%);
        }

        .car-animation {
            position: absolute;
            font-size: 50px;
            animation: drive 8s linear infinite;
            opacity: 0.4;
        }

        @keyframes drive {
            0% {
                left: -100px;
            }

            100% {
                left: calc(100% + 100px);
            }
        }

        .theme-marvel {
            background: linear-gradient(135deg, #1a0000 0%, #3d0000 50%, #1a0000 100%);
        }

        .marvel-hero {
            position: absolute;
            font-size: 45px;
            animation: heroFloat 4s ease-in-out infinite;
            opacity: 0.35;
        }

        @keyframes heroFloat {

            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-40px) rotate(5deg);
            }
        }

        .theme-dc {
            background: linear-gradient(135deg, #000a1a 0%, #001a3d 50%, #000a1a 100%);
        }

        .dc-hero {
            position: absolute;
            font-size: 45px;
            animation: dcFloat 5s ease-in-out infinite;
